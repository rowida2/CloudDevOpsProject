apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ivolve
  namespace: ivolve
spec:
  ingressClassName: nginx
  rules:
    # No "host:" on purpose: this rule matches any hostname / bare IP,
    # so it works from Windows (http://<wsl-ip>/) without editing hosts files.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
