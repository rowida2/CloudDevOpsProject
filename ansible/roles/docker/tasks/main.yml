- name: Install Docker
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true
  tags: service

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  tags: service

- name: Allow jenkins user to use Docker
  ansible.builtin.user:
    name: jenkins
    groups: docker
    append: true
  notify: Restart Jenkins
  tags: service